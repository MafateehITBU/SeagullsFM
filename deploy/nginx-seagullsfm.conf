# SeagullsFM – works by IP (no domain). To add a domain later, add a line:
#   server_name yourdomain.com www.yourdomain.com;
# and reload Nginx. Replace PROJECT_PATH with your actual path (e.g. /var/www/SeagullsFM).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Main site (moodfm-web) – CRA outputs to build/
    root PROJECT_PATH/moodfm-web/build;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → backend (Node on port 5000)
    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CMS admin panel (SPA under /cms/)
    location = /cms {
        return 302 /cms/;
    }
    location /cms/ {
        alias PROJECT_PATH/cms/build/;
        try_files $uri $uri/ /cms/index.html;
    }
}
