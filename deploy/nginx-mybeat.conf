# mybeat.fm – Beat FM website + API
# Copy to server, then: sed -i 's|PROJECT_PATH|/var/www/SeagullsFM|g' /etc/nginx/sites-available/mybeat
# Then: ln -sf /etc/nginx/sites-available/mybeat /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d mybeat.fm -d www.mybeat.fm

server {
    listen 80;
    listen [::]:80;
    server_name mybeat.fm www.mybeat.fm;

    root PROJECT_PATH/beat-web/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
